
spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    # ADICIONE ESTA LINHA ABAIXO:
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true